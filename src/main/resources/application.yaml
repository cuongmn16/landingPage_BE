server:
  port: ${PORT:8080}

spring:
  application:
    name: landing-page-backend
  config:
    # Load local secrets from page/.env (git-ignored). Real environment variables still take precedence.
    import: optional:file:.env[.properties]

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/landing_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # Secrets (mail password, JWT secret, ...) must come from environment variables / .env — never commit them here.
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:mission-attachments}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@ctin.vn}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
    notify-email: ${ADMIN_NOTIFY_EMAIL:}
  leaderboard:
    # Units that do not take part in the ranking (comma separated unit codes)
    excluded-unit-codes: ${LEADERBOARD_EXCLUDED_UNITS:PB_BTC}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  submission:
    max-files-per-mission: 5
    max-file-size-mb: 10
    allowed-extensions: jpg,jpeg,png,pdf,docx

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000} # 1 hour
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
